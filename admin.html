<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Admin | Laços Encantos de Menina</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <!-- Firebase SDK (Modular V9 via CDN) -->
    <script type="module" src="admin-app.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Nunito', 'sans-serif'] },
                    colors: {
                        brand: {
                            50: '#fdf2f8',
                            100: '#fce7f3',
                            500: '#ec4899',
                            600: '#db2777',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #f9fafb; }
        .hidden { display: none !important; }
        .glass-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.5);
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }
    </style>
</head>
<body class="antialiased text-gray-800">

    <!-- LOGIN SCREEN -->
    <div id="login-screen" class="min-h-screen flex items-center justify-center p-4 relative overflow-hidden">
        <div class="absolute inset-0 z-0 opacity-20 pointer-events-none" style="background-image: radial-gradient(#ec4899 1px, transparent 1px); background-size: 20px 20px;"></div>
        
        <div class="glass-panel p-8 rounded-3xl max-w-sm w-full z-10 text-center">
            <div class="w-20 h-20 mx-auto bg-brand-50 rounded-full flex items-center justify-center mb-4 border-4 border-white shadow-sm">
                <i class="ph-fill ph-lock-key text-4xl text-brand-500"></i>
            </div>
            <h1 class="text-2xl font-bold mb-1">Acesso Admin</h1>
            <p class="text-sm text-gray-500 mb-6">Entre para gerenciar os links.</p>

            <form id="login-form" class="space-y-4">
                <div>
                    <input type="email" id="email" required placeholder="E-mail" class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-brand-500 bg-gray-50 transition-all">
                </div>
                <div>
                    <input type="password" id="password" required placeholder="Senha" class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-brand-500 bg-gray-50 transition-all">
                </div>
                <button type="submit" id="btn-login" class="w-full py-3 bg-brand-500 hover:bg-brand-600 text-white font-bold rounded-xl shadow-md transition-colors flex items-center justify-center gap-2">
                    <span>Entrar</span>
                    <i class="ph-bold ph-sign-in"></i>
                </button>
                <p id="login-error" class="text-red-500 text-sm mt-2 hidden">Usuário ou senha incorretos.</p>
            </form>
        </div>
    </div>

    <!-- DASHBOARD SCREEN -->
    <div id="dashboard-screen" class="hidden min-h-screen bg-gray-50 pb-10">
        <!-- Header -->
        <header class="bg-white border-b border-gray-200 sticky top-0 z-40 shadow-sm">
            <div class="max-w-4xl mx-auto px-4 h-16 flex items-center justify-between">
                <div class="flex items-center gap-2">
                    <div class="w-8 h-8 rounded-full bg-brand-100 flex items-center justify-center text-brand-600">
                        <i class="ph-fill ph-crown"></i>
                    </div>
                    <span class="font-bold text-gray-800">Painel Jennifer</span>
                </div>
                <button id="btn-logout" class="text-gray-500 hover:text-red-500 flex items-center gap-1 text-sm font-medium transition-colors">
                    <i class="ph-bold ph-sign-out"></i> Sair
                </button>
            </div>
        </header>

        <!-- Main Content -->
        <main class="max-w-4xl mx-auto px-4 mt-8">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6">
                <div>
                    <h2 class="text-2xl font-bold text-gray-800">Gerenciar Links</h2>
                    <p class="text-sm text-gray-500">Arraste para reordenar ou adicione novos links para coleções.</p>
                </div>
                <button id="btn-add-new" class="bg-brand-500 hover:bg-brand-600 text-white px-5 py-2.5 rounded-xl font-bold shadow-md flex items-center justify-center gap-2 transition-all">
                    <i class="ph-bold ph-plus"></i> Novo Link
                </button>
            </div>

            <!-- Loading State -->
            <div id="loading-links" class="text-center py-10">
                <i class="ph ph-spinner animate-spin text-4xl text-brand-500 mb-2"></i>
                <p class="text-gray-500 text-sm">Carregando seus links...</p>
            </div>

            <!-- Links List Container -->
            <div id="links-container" class="space-y-3 hidden">
                <!-- Links will be injected here via JS -->
            </div>
            
            <p id="empty-state" class="text-center py-10 text-gray-400 hidden">Nenhum link cadastrado ainda.</p>

        </main>
    </div>

    <!-- MODAL FOR ADD/EDIT LINK -->
    <div id="link-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center hidden opacity-0 transition-opacity duration-200 p-4">
        <div class="bg-white rounded-2xl w-full max-w-md shadow-2xl overflow-hidden transform scale-95 transition-transform duration-200" id="link-modal-content">
            <div class="p-5 border-b border-gray-100 flex justify-between items-center bg-gray-50">
                <h3 id="modal-title" class="font-bold text-lg text-gray-800">Adicionar Link</h3>
                <button id="btn-close-modal" class="text-gray-400 hover:text-gray-700">
                    <i class="ph-bold ph-x text-xl"></i>
                </button>
            </div>
            
            <form id="link-form" class="p-5 space-y-4">
                <input type="hidden" id="link-id">
                
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">Título principal</label>
                    <input type="text" id="link-title" required placeholder="Ex: Nova Coleção Inverno" class="w-full px-4 py-2.5 rounded-lg border border-gray-200 focus:ring-2 focus:ring-brand-500 focus:outline-none">
                </div>
                
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">Subtítulo (opcional)</label>
                    <input type="text" id="link-subtitle" placeholder="Ex: Clique aqui para conferir" class="w-full px-4 py-2.5 rounded-lg border border-gray-200 focus:ring-2 focus:ring-brand-500 focus:outline-none">
                </div>
                
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">Link de destino (URL)</label>
                    <input type="url" id="link-url" required placeholder="https://..." class="w-full px-4 py-2.5 rounded-lg border border-gray-200 focus:ring-2 focus:ring-brand-500 focus:outline-none">
                </div>
                
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">Classe do Ícone (Phosphor Icons)</label>
                    <div class="flex gap-2">
                        <div class="w-12 flex items-center justify-center bg-brand-50 rounded-lg text-brand-500 border border-brand-100">
                            <i id="icon-preview" class="ph-bold ph-link text-xl"></i>
                        </div>
                        <input type="text" id="link-icon" value="ph-link" placeholder="ph-link, ph-shopping-bag..." class="flex-1 px-4 py-2.5 rounded-lg border border-gray-200 focus:ring-2 focus:ring-brand-500 focus:outline-none">
                    </div>
                    <p class="text-xs text-gray-400 mt-1">Busque ícones em <a href="https://phosphoricons.com/" target="_blank" class="text-brand-500 underline">phosphoricons.com</a></p>
                </div>

                <div class="flex items-center gap-2 mt-2">
                    <input type="checkbox" id="link-highlight" class="w-4 h-4 text-brand-500 rounded border-gray-300 focus:ring-brand-500">
                    <label for="link-highlight" class="text-sm font-bold text-gray-700">Destacar esse botão (estilo pink)</label>
                </div>
                
                <div class="pt-4 flex gap-3">
                    <button type="button" id="btn-cancel-modal" class="flex-1 py-3 bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold rounded-xl transition-colors">Cancelar</button>
                    <button type="submit" id="btn-save-link" class="flex-1 py-3 bg-brand-500 hover:bg-brand-600 text-white font-bold rounded-xl shadow-md transition-colors flex items-center justify-center gap-2">
                        <i class="ph-bold ph-check"></i> Salvar
                    </button>
                </div>
            </form>
        </div>
    </div>

</body>
</html>
